openapi: 3.1.0
info:
  title: Gebeya One API
  version: 0.1.0
  summary: Phase 1 contract for the consumer app, merchant app and admin console.
  description: |
    Conventions
    - Money is always an object `{amount_minor, currency}`. `amount_minor` is an integer in the currency's
      minor unit (1 ETB = 100 santim). Never send floats.
    - Every request that moves money or changes state requires an `Idempotency-Key` header (UUID).
      Retrying with the same key returns the original response; the same key with a different body returns 409.
    - Payments follow an intent → confirm flow. Creating an intent never moves money. Confirming it does,
      after a risk decision and, where needed, step-up authentication (biometric signature or PIN).
    - Times are RFC 3339 in UTC. Clients render them in the user's time zone and calendar.
    - Errors use RFC 9457 problem details with a stable `code` and a localised `message`.
    - Funds are held and moved by licensed partners. This API orchestrates them and never stores card
      numbers or full bank account numbers.
servers:
  - url: https://api.gebeya.one
    description: Production (placeholder)
  - url: https://sandbox.api.gebeya.one
    description: Sandbox with simulated rails (placeholder)

security:
  - userToken: []

tags:
  - name: Auth
  - name: Profile
  - name: Wallet
  - name: Payments
  - name: Bills
  - name: Merchants
  - name: Commerce
    description: |
      Ordering from shops in the app. An order is paid like any payment (POST /v1/orders creates it with a
      payment intent, which the customer confirms with POST /v1/payment-intents/{id}/confirm), but the money waits
      in order escrow. The shop is paid when the order is handed over, with the customer's four-digit code or the
      customer's own confirmation. Cancelled orders are refunded to the wallet at once.
  - name: Admin
  - name: Webhooks
  - name: Notifications

paths:
  /v1/auth/otp:
    post:
      tags: [Auth]
      summary: Send a one-time code by SMS
      security: []
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
                purpose: { type: string, enum: [signup, login, pin_reset, device_bind] }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '202':
          description: Code sent. The same response is returned whether or not the number is registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  resend_after_seconds: { type: integer, example: 30 }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the code and bind this device
      security: []
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code, device]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: |
            Verified. Returns a session; `needs_pin` is true until the user sets a PIN.
            A session from a `pin_reset` code may set a new PIN without the current one, once, within 15 minutes.
            After such a reset every other session is signed out and outgoing payments are held for review for 24 hours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/token/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: Refresh tokens are single use. Presenting a used token revokes every session in its family.
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/pin:
    put:
      tags: [Auth]
      summary: Set or change the 6-digit PIN
      operationId: setPin
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_pin]
              properties:
                current_pin: { type: string, pattern: '^[0-9]{6}$', description: Required unless the session came from a pin_reset OTP. }
                new_pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: PIN updated }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out this device
      description: Revokes the caller's session family. Other devices stay signed in.
      operationId: logout
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [Profile]
      summary: Current user's profile, KYC level and limits
      operationId: getMe
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Profile]
      summary: Update display name, email or locale
      description: Send only the fields to change. An empty email removes it. Emails are unique regardless of case (409 if taken).
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 60 }
                email: { type: string, format: email }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /v1/me/kyc:
    post:
      tags: [Profile]
      summary: Start a KYC upgrade with Fayda national ID
      operationId: startKyc
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [fayda, passport] }
                fayda_fan: { type: string, description: Fayda alias number. Sent to the ID provider and not stored by us. }
      responses:
        '202':
          description: Verification started. The result arrives as a `kyc.decided` notification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }

  /v1/topups:
    post:
      tags: [Wallet]
      summary: Add money from a partner rail
      description: |
        Starts a top-up and returns a checkout link where the customer pays inside the partner's own app or page.
        Nothing is credited until the partner confirms the payment, which happens through the rail webhook or a
        background check every minute. Poll `GET /v1/payment-intents/{id}` or wait for the push notification.
        A rail without configured merchant credentials answers `rail_unavailable`.
      operationId: startTopUp
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, rail]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                rail: { type: string, enum: [telebirr] }
      responses:
        '201':
          description: Top-up started. The intent is `processing`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent: { $ref: '#/components/schemas/PaymentIntent' }
                  checkout_url: { type: string, format: uri }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/wallet/balances:
    get:
      tags: [Wallet]
      summary: Balances per currency, plus points
      operationId: getBalances
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        available: { $ref: '#/components/schemas/Money' }
                        held: { $ref: '#/components/schemas/Money' }
                  points: { type: integer, example: 1240 }
                  as_of: { type: string, format: date-time }

  /v1/activity:
    get:
      tags: [Wallet]
      summary: Unified activity feed (payments, orders, bills, transfers)
      description: |
        Newest first. Payments the user never confirmed, or cancelled, are left out because no money moved.
        Pass `next_cursor` back as `cursor` for the next page; it is opaque and stops working if the list changes shape.
      operationId: listActivity
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, money, orders] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of activity, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
                  next_cursor: { type: [string, 'null'] }

  /v1/notifications:
    get:
      tags: [Notifications]
      summary: The user's notifications, newest first, with the unread count
      description: |
        Written in the user's language when the event happened. The app polls this while it is open and shows
        the unread count on the bell; push messages (when Firebase is configured) carry the same text.
        Kinds: `money_received`; for outcomes decided after the payer left the confirm screen,
        `payment_succeeded`, `payment_failed`, `topup_succeeded`, `topup_failed`, `topup_held`; and security
        alerts `new_device`, `pin_reset`, `pin_changed`, `session_revoked`, `biometric_enrolled`.
      operationId: listNotifications
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, unread]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  next_cursor: { type: [string, 'null'] }
                  unread: { type: integer, minimum: 0, description: 'Unread notifications in total, not just on this page.' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications read
      description: 'Send `ids`, or `all: true`. Ids belonging to someone else are ignored. Repeating the call changes nothing, so no Idempotency-Key is needed.'
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        '200':
          description: How many changed
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/devices/current/biometric-key:
    put:
      tags: [Auth]
      summary: Turn on fingerprint or face confirmation for payments on this device
      description: |
        The app creates a P-256 key in secure hardware that can only be used after the phone's biometric check,
        and sends its public key here with the PIN (wrong PINs count toward the lockout). An SMS code alone can
        never set this up. A PIN reset turns it off on every device. All the user's devices get a security notification.
      operationId: putBiometricKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, pin]
              properties:
                public_key: { type: string, description: 'Base64 DER SubjectPublicKeyInfo (Android) or uncompressed point (iOS).' }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Enrolled }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Auth]
      summary: Turn biometric confirmation off on this device
      operationId: deleteBiometricKey
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/devices/current/push-token:
    put:
      tags: [Notifications]
      summary: Register this device's Firebase push token
      description: |
        Android and iPhone only. Replaces the device's earlier token. A token already held by another device
        (the phone was signed in to another account) moves to this one. Signing out removes it.
      operationId: putPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
      responses:
        '204': { description: Stored }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Notifications]
      summary: Stop push notifications to this device
      operationId: deletePushToken
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/funding-sources:
    get:
      tags: [Wallet]
      summary: Linked Telebirr, bank and card sources
      operationId: listFundingSources
      responses:
        '200':
          description: Linked sources
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FundingSource' } }
    post:
      tags: [Wallet]
      summary: Start linking a source
      description: Returns a partner consent URL or an OTP challenge, depending on the rail.
      operationId: linkFundingSource
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rail]
              properties:
                rail: { $ref: '#/components/schemas/Rail' }
                bank_code: { type: string, description: EthSwitch participant code for bank links. }
      responses:
        '202':
          description: Linking started
          content:
            application/json:
              schema:
                type: object
                properties:
                  funding_source_id: { type: string, format: uuid }
                  next_action:
                    type: object
                    properties:
                      type: { type: string, enum: [redirect, partner_otp] }
                      url: { type: string, format: uri }

  /v1/payment-intents:
    post:
      tags: [Payments]
      summary: Create a payment intent (no money moves yet)
      description: |
        Returns the exact fee, total and points before the user confirms. Used for P2P, QR merchant
        payments, bills, airtime, orders, mini-app payments and transfers abroad.
      operationId: createPaymentIntent
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentIntentCreate' }
            examples:
              qr:
                summary: Pay a merchant after scanning a QR
                value:
                  kind: qr_merchant
                  qr_payload: '000201010212...6304ABCD'
                  amount: { amount_minor: 18500, currency: ETB }
                  funding_source_id: null
              bill:
                summary: Pay a saved electricity bill
                value:
                  kind: bill
                  bill_statement_id: 2f7c4a3e-1b7d-4a55-9a51-8d1f0e1c7b20
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/payment-intents/{id}:
    get:
      tags: [Payments]
      summary: Get an intent's current status
      operationId: getPaymentIntent
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/payment-intents/{id}/confirm:
    post:
      tags: [Payments]
      summary: Confirm and execute the payment
      description: |
        Requires proof of user presence: the PIN, or `biometric_signature`, an ECDSA P-256 / SHA-256 signature
        (ASN.1 DER, base64) over the intent's `confirm_challenge` from this device's biometric key (registered with
        `PUT /v1/devices/current/biometric-key`). A refused signature (`biometric_not_enrolled`, `biometric_failed`)
        means: ask for the PIN instead. The response is usually final
        (`succeeded`). It can also be `processing` (the rail is slow; the final state arrives as a push notification) or `held_for_review`.
      operationId: confirmPaymentIntent
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [biometric_signature]
                - required: [pin]
              properties:
                biometric_signature: { type: string, description: Base64 signature from the device enclave key. }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/payment-intents/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel an intent that has not been confirmed
      operationId: cancelPaymentIntent
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/qr/resolve:
    post:
      tags: [Payments]
      summary: Resolve a scanned QR to a verified payee
      operationId: resolveQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: Raw EMVCo QR string. }
      responses:
        '200':
          description: Payee details to show before the amount screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  payee_type: { type: string, enum: [merchant, user] }
                  payee_id: { type: string, format: uuid }
                  display_name: { type: string, example: 'Buna House, Bole' }
                  verified: { type: boolean }
                  fixed_amount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
                  active_offer: { type: [string, 'null'], example: Double points until Sun 24 Nov }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/fx/quotes:
    post:
      tags: [Payments]
      summary: Lock an exchange rate for a transfer or conversion
      operationId: createFxQuote
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sell_currency, buy_currency]
              properties:
                sell_currency: { $ref: '#/components/schemas/Currency' }
                buy_currency: { $ref: '#/components/schemas/Currency' }
                sell_amount_minor: { type: integer, minimum: 1 }
                buy_amount_minor: { type: integer, minimum: 1 }
              oneOf:
                - required: [sell_amount_minor]
                - required: [buy_amount_minor]
      responses:
        '201':
          description: Quote locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxQuote' }

  /v1/billers:
    get:
      tags: [Bills]
      summary: Billers available in the user's region
      operationId: listBillers
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [electricity, water, internet, tv, telecom, education, government, insurance] } }
      responses:
        '200':
          description: Billers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Biller' } }

  /v1/saved-billers:
    get:
      tags: [Bills]
      summary: The user's saved billers with their latest statement
      operationId: listSavedBillers
      responses:
        '200':
          description: Saved billers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SavedBiller' } }
    post:
      tags: [Bills]
      summary: Save a biller account (looks up the account holder name first)
      operationId: saveBiller
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [biller_id, account_ref]
              properties:
                biller_id: { type: string, format: uuid }
                account_ref: { type: string, example: '0412 7781' }
                nickname: { type: string, example: Home electricity }
                autopay: { type: boolean, default: false }
                autopay_max: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedBiller' }

  /v1/merchants:
    post:
      tags: [Merchants]
      summary: Apply as a merchant (KYB)
      description: |
        The signed-in user (who must have set a PIN) becomes the owner. The shop can't take payments until
        operations staff approve it; approval gives it a merchant number and a payment QR. Sending the same
        application again returns the first one; a person can have one application under review at a time.
      operationId: applyMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, trade_name, tin, category_code, city]
              properties:
                legal_name: { type: string, maxLength: 120 }
                trade_name: { type: string, maxLength: 60 }
                tin: { type: string, pattern: '^[0-9]{10}$' }
                business_licence: { type: string }
                category_code:
                  type: string
                  enum: ['5411', '5812', '5814', '5912', '5651', '5732', '5251', '7230', '4121', '8299', '5999']
                city: { type: string, maxLength: 40 }
      responses:
        '201':
          description: Application received; status is `kyb_review`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/me/merchants:
    get:
      tags: [Merchants]
      summary: Businesses the signed-in user belongs to, with their role
      operationId: listMyMerchants
      responses:
        '200':
          description: Businesses, oldest membership first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Merchant' } }

  /v1/web-logins/lookup:
    post:
      tags: [Merchants]
      summary: Which browser is showing a sign-in code for the web business console
      description: "The app calls this before asking for the PIN, so the person can check it's their own computer."
      operationId: lookupWebLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "The 8 characters shown in the browser; case, spaces and the dash don't matter.", example: ABCD-EFGH }
      responses:
        '200':
          description: The browser waiting for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLogin' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/web-logins/approve:
    post:
      tags: [Merchants]
      summary: Sign a browser in to the web business console for one shop
      description: |
        Any member of an approved shop can approve, with their PIN; the console then follows their role. The code
        works for 5 minutes and once. The person is notified (identity.web_signed_in). The browser's session
        ends after 2 hours without use, 12 hours at most, or as soon as the person leaves the shop.
      operationId: approveWebLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, merchant_id, pin]
              properties:
                code: { type: string }
                merchant_id: { type: string, format: uuid }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Approved; the browser moves on by itself
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLogin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/me/web-sessions:
    get:
      tags: [Merchants]
      summary: The person's browsers signed in to the web business console
      operationId: listWebSessions
      responses:
        '200':
          description: Browsers, most recently used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WebSession' } }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/me/web-sessions/{id}:
    delete:
      tags: [Merchants]
      summary: Sign one of the person's browsers out
      operationId: deleteWebSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}:
    get:
      tags: [Merchants]
      summary: One business the user belongs to
      description: Cashiers don't see the registration details (legal name, TIN, licence). Others get 404.
      operationId: getMerchant
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}/qr:
    get:
      tags: [Merchants]
      summary: The shop's payment QR
      description: |
        An EMVCo merchant-presented static QR (the payer enters the amount). The merchant account template
        uses the GUID `one.gebeya.pay`; until the national interoperable QR scheme registers it, only Gebeya
        One resolves it. 409 `merchant_not_active` before approval.
      operationId: getMerchantQR
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: QR payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload: { type: string }
                  merchant_no: { type: string, pattern: '^[0-9]{8}$' }
                  trade_name: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}/documents:
    get:
      tags: [Merchants]
      summary: KYB documents sent for the shop
      description: |
        Owners and managers. Replaced documents are left out. `required` lists the kinds the application
        needs accepted before operations can approve it.
      operationId: listMerchantDocuments
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items, required]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MerchantDocument' } }
                  required: { type: array, items: { $ref: '#/components/schemas/DocumentKind' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Merchants]
      summary: Send a KYB document
      description: |
        Owner only. The body is the file itself (at most 10 MB). The server goes by the file's content, not
        the Content-Type: only JPEG, PNG and PDF are taken. Sending the same file again returns the stored
        document, so a retry is safe. A new document of a kind replaces the earlier ones of that kind (except
        `other`). Files are encrypted before storage. 503 `documents_unavailable` when storage isn't set up.
      operationId: uploadMerchantDocument
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/DocumentKind' } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Stored, waiting for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantDocument' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}/payments:
    get:
      tags: [Merchants]
      summary: Payments the shop received, newest first
      description: Every member, cashiers included. Payers are shown by first name and initial.
      operationId: listMerchantPayments
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        payer_name: { type: string, example: Abebe K. }
                        amount: { $ref: '#/components/schemas/Money' }
                        completed_at: { type: string, format: date-time }
                  next_cursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}/summary:
    get:
      tags: [Merchants]
      summary: Today's figures for the merchant app and dashboard
      description: |
        "Today" is the day in Addis Ababa. Cashiers get sales only; `pending_payout` and `next_payout` are null
        for them. `pending_payout` is money earned and not yet paid out (unbatched sales plus reserved payouts).
      operationId: getMerchantSummary
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  sales_today: { $ref: '#/components/schemas/Money' }
                  payments_today: { type: integer }
                  average_basket: { $ref: '#/components/schemas/Money' }
                  pending_payout:
                    oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ]
                  next_payout:
                    type: [object, 'null']
                    properties:
                      id: { type: string, format: uuid }
                      net: { $ref: '#/components/schemas/Money' }
                      status: { type: string, enum: [scheduled, sent, on_hold] }
                      hold_reason: { type: [string, 'null'] }
                      scheduled_for: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/merchants/{id}/payouts:
    get:
      tags: [Merchants]
      summary: Payout history with commission and fee breakdown
      description: |
        Owners, managers and accountants. Payouts batch the merchant's unpaid QR sales on its schedule (daily
        and weekly cut off at midnight Addis Ababa time) and are sent through a licensed payout partner. Until
        one is connected they stay `scheduled`; the money is reserved for the merchant either way.
      operationId: listPayouts
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Payouts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Payout' } }
                  next_cursor: { type: [string, 'null'] }

  /v1/merchants/{id}/payout-destination:
    get:
      tags: [Merchants]
      summary: Where the merchant's payouts go
      description: Owners, managers and accountants. 404 when no payout account is set.
      operationId: getPayoutDestination
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Current payout account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Merchants]
      summary: Change where payouts go
      description: |
        Owners only, with their PIN. Every owner and accountant is notified, and nothing is paid to the new
        account for 48 hours (`payouts_from`), so a hijacked change can be stopped. Payouts waiting for an
        account are scheduled for the end of that period.
      operationId: putPayoutDestination
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rail, account, pin]
              properties:
                rail: { type: string, enum: [telebirr, cbe_birr, mpesa_et, ethswitch] }
                bank_code: { type: string, description: EthSwitch participant code. Required for ethswitch. }
                account: { type: string, description: 'Wallet number (+2519…/+2517…) or bank account number (8 to 20 digits).' }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/shops:
    get:
      tags: [Commerce]
      summary: Shops taking orders in the app
      description: Approved shops with at least one product on sale. Open shops first.
      operationId: listShops
      responses:
        '200':
          description: Shops
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Shop' } }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/shops/{id}:
    get:
      tags: [Commerce]
      summary: A shop's page, with the products on sale
      operationId: getShop
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The shop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/orders:
    post:
      tags: [Commerce]
      summary: Place an order
      description: |
        Checks the shop is open and offers the channel, prices the basket from the current catalog, sets the stock
        aside, and creates the payment (`payment_intent_id`). Confirm that intent with the PIN or biometrics. Orders
        not paid within 30 minutes are cancelled and their stock returned. Staff of a shop can't order from it.
      operationId: placeOrder
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_id, channel, items]
              properties:
                merchant_id: { type: string, format: uuid }
                channel: { type: string, enum: [pickup, delivery] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 99 }
                delivery_address: { type: string, maxLength: 300, description: Required for delivery. Include a landmark. }
                note: { type: string, maxLength: 280 }
      responses:
        '201':
          description: Order waiting for payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Commerce]
      summary: My orders, newest first
      description: Orders that were never paid for are left out.
      operationId: listOrders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/orders/{id}:
    get:
      tags: [Commerce]
      summary: One of my orders
      operationId: getOrder
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: The order, with the handover code while it's in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/orders/{id}/cancel:
    post:
      tags: [Commerce]
      summary: Cancel my order
      description: Allowed until the shop accepts it. A paid order is refunded to the wallet at once.
      operationId: cancelOrder
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/orders/{id}/received:
    post:
      tags: [Commerce]
      summary: Confirm I have my order
      description: For when the shop can't take the handover code. The shop is paid.
      operationId: orderReceived
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/merchants/{id}/shop:
    get:
      tags: [Commerce]
      summary: The shop's ordering settings and catalog
      description: Any member of the shop. Includes hidden products; archived ones are left out.
      operationId: getShopSettings
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Settings and products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Commerce]
      summary: Change the shop's ordering settings
      description: Owners and managers. Opening needs an approved shop with at least one product on sale.
      operationId: putShopSettings
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                open: { type: boolean }
                pickup: { type: boolean }
                delivery: { type: boolean }
                delivery_fee: { $ref: '#/components/schemas/Money' }
                delivery_area: { type: string, maxLength: 200, description: Required when delivery is on. }
                about: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shop' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/merchants/{id}/products:
    post:
      tags: [Commerce]
      summary: Add a product
      description: Owners and managers. Up to 500 products that aren't archived.
      operationId: createProduct
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/merchants/{id}/products/{product}:
    put:
      tags: [Commerce]
      summary: Change a product
      description: Owners and managers. Orders already placed keep the title and price they were placed with.
      operationId: putProduct
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: product, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/merchants/{id}/orders:
    get:
      tags: [Commerce]
      summary: The shop's paid orders
      description: |
        Any member. `active` (placed, accepted, ready, on the way; oldest first) or `done` (delivered or cancelled;
        newest first). The customer's phone number is shown in full only on delivery orders in progress.
      operationId: listShopOrders
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: state, in: query, schema: { type: string, enum: [active, done], default: active } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/merchants/{id}/orders/{order}/{action}:
    post:
      tags: [Commerce]
      summary: Move an order on
      description: |
        Owners, managers and cashiers. `accept` (within 20 minutes of the order being paid, or it's cancelled and
        refunded), `ready`, `on_the_way` (delivery only), `hand_over` with the customer's `code` (the shop is paid;
        after 5 wrong codes the customer must confirm in their app), `cancel` with a `note` the customer sees
        (refunded at once).
      operationId: shopOrderAction
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: order, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [accept, ready, on_the_way, hand_over, cancel] } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^[0-9]{4}$' }
                note: { type: string, maxLength: 280 }
      responses:
        '200':
          description: The order now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/admin/risk/cases:
    get:
      tags: [Admin]
      summary: Fraud case queue
      security: [ { staffToken: [risk.cases.view] } ]
      operationId: listRiskCases
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unassigned, in_review, awaiting_approval, resolved, escalated_aml] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Cases, highest risk first. Personal data is masked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiskCase' } }
                  next_cursor: { type: [string, 'null'] }

  /v1/admin/risk/cases/{id}/actions:
    post:
      tags: [Admin]
      summary: Take an action on a case
      description: |
        Actions that need a second approver (freeze, release over the limit) return 202 with an
        approval request. Every call is written to the audit log, including denied ones.
      security: [ { staffToken: [risk.cases.act] } ]
      operationId: actOnRiskCase
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action: { type: string, enum: [freeze_and_recall, keep_paused, escalate_aml, release] }
                note: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '200':
          description: Applied immediately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskCase' }
        '202':
          description: Sent for approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/admin/approvals/{id}/decision:
    post:
      tags: [Admin]
      summary: Approve or reject another staff member's request
      description: Returns 403 if the caller made the request or lacks `approve` on the permission.
      security: [ { staffToken: [approvals.decide] } ]
      operationId: decideApproval
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Decision recorded and, if approved, applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/webhooks/rails/{rail}:
    post:
      tags: [Webhooks]
      summary: Payment notifications from partner rails
      description: |
        Each partner signs notifications its own way; the body is the partner's own format.
        - telebirr: an RSA signature (`sign`) inside the JSON body, verified with telebirr's public key.

        A notification never credits anything by itself. Once its signature checks out, the server asks the
        partner for the order's state (telebirr `queryOrder`) and acts on that answer, so a replayed or
        altered notification can at most trigger a status check. Repeats are harmless: a top-up settles once.
      security: [ { partnerSignature: [] } ]
      operationId: railCallback
      parameters:
        - { name: rail, in: path, required: true, schema: { $ref: '#/components/schemas/Rail' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Partner-specific notification fields.
      responses:
        '200':
          description: Handled, or not ours to handle. The partner should stop retrying.
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503':
          description: The partner couldn't be reached to confirm the order. Retry later.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ed25519-signed JWT valid 15 minutes, checked against a live session on every request.
        DPoP (RFC 9449): when sign-in carries a `DPoP` proof, the session is bound to that device key
        (`token_type: DPoP`). Then every request sends `Authorization: DPoP <token>` plus a fresh `DPoP` header:
        an ES256 JWT with `typ: dpop+jwt`, the public `jwk` (P-256), and claims `jti`, `htm`, `htu`, `iat`
        and `ath` (base64url SHA-256 of the access token). Each proof is accepted once and for 5 minutes.
        Refreshing a bound session needs a proof from the same key. Unbound (bearer) sessions keep working
        until the server sets DPOP_REQUIRED.
    staffToken:
      type: oauth2
      description: Staff sign in through the company identity provider with hardware MFA. Scopes map to admin.role_permissions.
      flows:
        authorizationCode:
          authorizationUrl: https://sso.gebeya.one/authorize
          tokenUrl: https://sso.gebeya.one/token
          scopes:
            risk.cases.view: View fraud cases
            risk.cases.act: Act on fraud cases
            approvals.decide: Approve or reject requests
    partnerSignature:
      type: apiKey
      in: header
      name: X-Partner-Signature
      description: Placeholder for partners that sign with a header. telebirr signs inside the body instead (see railCallback).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    WebLogin:
      type: object
      properties:
        browser: { type: string, example: Chrome on Windows }
        ip: { type: string, example: 196.188.10.4 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    WebSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchant_id: { type: string, format: uuid }
        shop_name: { type: string }
        browser: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    Currency:
      type: string
      enum: [ETB, USD, EUR, GBP, KES, AED, SAR]
    Locale:
      type: string
      enum: [am, om, ti, en]
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      example: '+251911234567'
    Rail:
      type: string
      enum: [wallet, telebirr, cbe_birr, mpesa_et, ethswitch, card, remittance]
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, description: Minor units. ETB 185.00 is 18500. }
        currency: { $ref: '#/components/schemas/Currency' }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine code.
          enum: [insufficient_funds, limit_exceeded, kyc_required, payee_not_found, quote_expired, rail_unavailable, step_up_required, invalid_pin, pin_locked, idempotency_conflict, permission_denied, self_approval, validation_failed, rate_limited, unauthenticated, not_found, invalid_state, payment_blocked, internal, otp_invalid, otp_expired, sms_unavailable, device_not_trusted]
        message: { type: string, description: Localised to the user's locale. }
        charged: { type: boolean, description: Present on payment failures. Tells the client whether money left the account. }
    DeviceRegistration:
      type: object
      required: [platform, attestation]
      properties:
        platform: { type: string, enum: [android, ios, web] }
        model: { type: string }
        attestation: { type: string, description: Play Integrity or App Attest token. }
    Session:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer, DPoP], description: '`DPoP` when the sign-in carried a DPoP proof.' }
        expires_in: { type: integer, example: 900 }
        user_id: { type: string, format: uuid }
        needs_pin: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email }
        display_name: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        kyc_level: { type: string, enum: [L0, L1, L2, L3] }
        status: { type: string, enum: [pending, active, restricted, frozen, closed] }
        has_pin: { type: boolean }
        limits:
          type: [object, 'null']
          description: |
            Null until compliance configures limits for the user's KYC level. Sending is refused with
            `limit_exceeded` (403) over the daily or monthly limit, and receiving or topping up past the
            balance limit is refused the same way.
          properties:
            max_balance: { $ref: '#/components/schemas/Money' }
            daily_out_remaining: { $ref: '#/components/schemas/Money' }
            monthly_out_remaining: { $ref: '#/components/schemas/Money' }
    FundingSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        rail: { $ref: '#/components/schemas/Rail' }
        label: { type: string, example: CBE ••8812 }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [pending, active, removed] }
    PaymentIntentCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [p2p, qr_merchant, bill, airtime, order, remittance_out, miniapp] }
        amount: { $ref: '#/components/schemas/Money' }
        funding_source_id: { type: [string, 'null'], format: uuid, description: Null pays from the wallet balance. }
        payee_user_id: { type: string, format: uuid }
        payee_phone: { $ref: '#/components/schemas/Phone' }
        payee_bank: { type: object, properties: { bank_code: { type: string }, account_token: { type: string } } }
        qr_payload: { type: string }
        bill_statement_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        fx_quote_id: { type: string, format: uuid }
        note: { type: string, maxLength: 140 }
    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [created, requires_confirmation, processing, held_for_review, succeeded, failed, cancelled, reversed] }
        payee:
          type: object
          properties:
            type: { type: string, enum: [user, merchant, biller, external] }
            display_name: { type: string, example: Abebe Girma }
            verified_name: { type: boolean, description: True when the name came from the bank or KYC record. }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        points_to_earn: { type: integer }
        rail: { $ref: '#/components/schemas/Rail' }
        step_up: { type: string, enum: [none, biometric_or_pin, otp], description: What confirm will require. }
        confirm_challenge:
          type: string
          description: |
            Present while the intent can be confirmed. Base64 of the exact bytes the device's biometric key signs:
            "gebeya-one/confirm/v1\nintent:<id>\namount:<minor> <cur>\nfee:<minor> <cur>\npayee:<type>:<id>\n".
        failure: { oneOf: [ { $ref: '#/components/schemas/Problem' }, { type: 'null' } ] }
        receipt_url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }
    Shop:
      type: object
      properties:
        merchant_id: { type: string, format: uuid }
        name: { type: string, example: Merkato Fresh }
        category: { type: string }
        city: { type: string }
        open: { type: boolean, description: Taking orders now. }
        pickup: { type: boolean }
        delivery: { type: boolean, description: The shop delivers itself. }
        delivery_fee: { $ref: '#/components/schemas/Money' }
        delivery_area: { type: string }
        about: { type: string }
        product_count: { type: integer }
        products: { type: array, items: { $ref: '#/components/schemas/Product' }, description: Single shop only. }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: 'Teff flour, 5 kg' }
        description: { type: string }
        category: { type: string, description: The shop's own shelf name. }
        price: { $ref: '#/components/schemas/Money' }
        stock: { type: [integer, 'null'], description: Null when the shop doesn't count it. }
        sold_out: { type: boolean }
        status: { type: string, enum: [active, hidden, archived] }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, price]
      properties:
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 40 }
        price: { $ref: '#/components/schemas/Money' }
        stock: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        status: { type: string, enum: [active, hidden, archived], default: active }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: OR-100001 }
        status: { type: string, enum: [pending_payment, placed, accepted, ready, on_the_way, delivered, cancelled] }
        channel: { type: string, enum: [pickup, delivery] }
        merchant_id: { type: string, format: uuid }
        shop_name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              title: { type: string }
              unit_price: { $ref: '#/components/schemas/Money' }
              quantity: { type: integer }
              line_total: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        delivery_fee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        delivery_address: { type: string }
        note: { type: string }
        payment_intent_id: { type: [string, 'null'], format: uuid }
        payment_status: { type: string, description: The payment intent's status. }
        handover_code: { type: string, description: 'Customer only, while the order is in progress. Never sent in notifications.' }
        customer:
          type: object
          description: Shop only.
          properties:
            name: { type: string }
            phone: { type: string, description: 'Full on delivery orders in progress, masked otherwise.' }
        cancel_reason: { type: string, enum: ['', customer_cancelled, shop_declined, shop_cancelled, no_response, payment_failed, payment_not_finished] }
        cancel_note: { type: string, description: The shop's words to the customer. }
        accept_by: { type: [string, 'null'], format: date-time, description: Placed orders. Cancelled and refunded if the shop hasn't accepted by then. }
        created_at: { type: string, format: date-time }
        placed_at: { type: [string, 'null'], format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
    FxQuote:
      type: object
      properties:
        id: { type: string, format: uuid }
        sell: { $ref: '#/components/schemas/Money' }
        buy: { $ref: '#/components/schemas/Money' }
        rate: { type: string, example: '142.60000000', description: Decimal string to avoid float rounding. }
        fee: { $ref: '#/components/schemas/Money' }
        expires_at: { type: string, format: date-time }
    ActivityItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [payment, transfer_in, transfer_out, bill, order, topup, withdrawal, refund] }
        title: { type: string, example: 'Buna House, Bole' }
        subtitle: { type: string, example: QR payment }
        direction: { type: string, enum: [in, out] }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, completed, failed, refunded] }
        charged: { type: boolean, description: Outgoing items only. Whether money left the wallet. }
        failure_code: { type: string, description: 'Problem code when status is failed, for example insufficient_funds or limit_exceeded.' }
        occurred_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, kind, title, body, data, created_at, read]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [money_received, payment_succeeded, payment_failed, topup_succeeded, topup_failed, topup_held, new_device, pin_reset, pin_changed, session_revoked, biometric_enrolled, payout_settled, payout_on_hold, payout_on_hold_no_destination, payout_on_hold_merchant_suspended, payout_on_hold_rejected_by_partner, payout_on_hold_too_many_failures, payout_destination_changed, merchant_applied, merchant_approved] }
        title: { type: string, example: Money received }
        body: { type: string, example: 'Abebe sent you ETB 150.00.' }
        data:
          type: object
          additionalProperties: { type: string }
          description: '`intent_id` for payment notifications (open the payment), `kind: security` for alerts.'
        created_at: { type: string, format: date-time }
        read: { type: boolean }
    Biller:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: eeu_prepaid }
        name: { type: string, description: In the request locale. }
        category: { type: string }
        account_format_hint: { type: string, example: 8-digit meter number }
        fee: { $ref: '#/components/schemas/Money' }
    SavedBiller:
      type: object
      properties:
        id: { type: string, format: uuid }
        biller: { $ref: '#/components/schemas/Biller' }
        account_ref: { type: string }
        account_holder: { type: string, description: Name returned by the biller lookup. }
        nickname: { type: string }
        autopay: { type: boolean }
        latest_statement:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            amount: { $ref: '#/components/schemas/Money' }
            due_date: { type: string, format: date }
            status: { type: string, enum: [due, paid, overdue] }
    DocumentKind:
      type: string
      enum: [tin_certificate, trade_licence, owner_id, other]
    MerchantDocument:
      type: object
      required: [id, kind, content_type, size_bytes, status, uploaded_at, reviewed_at, review_note]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        content_type: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        size_bytes: { type: integer }
        status: { type: string, enum: [submitted, accepted, rejected] }
        uploaded_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        review_note: { type: [string, 'null'], description: Why it was rejected; shown to the owner }
    Merchant:
      type: object
      properties:
        id: { type: string, format: uuid }
        trade_name: { type: string }
        legal_name: { type: string, description: Not shown to cashiers. }
        tin: { type: string, description: Not shown to cashiers. }
        business_licence: { type: string, description: Not shown to cashiers. }
        category_code: { type: string }
        city: { type: string }
        status: { type: string, enum: [applied, kyb_review, active, suspended, closed] }
        merchant_no: { type: [string, 'null'], description: 8 digits with a Luhn check digit; given on approval. }
        role: { type: string, enum: [owner, manager, cashier, accountant], description: The caller's role. }
        payout_schedule: { type: string, enum: [instant, daily, weekly] }
        created_at: { type: string, format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        gross: { $ref: '#/components/schemas/Money' }
        commission: { $ref: '#/components/schemas/Money' }
        fees: { $ref: '#/components/schemas/Money' }
        refunds: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [scheduled, sent, settled, on_hold] }
        hold_reason:
          type: [string, 'null']
          enum: [no_destination, merchant_suspended, rejected_by_partner, too_many_failures, null]
        destination_label: { type: string, example: CBE ••8812 }
        scheduled_for: { type: string, format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
    PayoutDestination:
      type: object
      properties:
        id: { type: string, format: uuid }
        rail: { type: string, enum: [telebirr, cbe_birr, mpesa_et, ethswitch] }
        label: { type: string, example: telebirr ••4567 }
        created_at: { type: string, format: date-time }
        payouts_from: { type: string, format: date-time, description: When payouts to this account can start (after the cooling-off). }
    RiskCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: FR-20931 }
        subject: { type: string, example: User ••4471 }
        summary: { type: string }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        amount: { $ref: '#/components/schemas/Money' }
        rules_hit: { type: array, items: { type: string } }
        status: { type: string, enum: [unassigned, in_review, awaiting_approval, resolved, escalated_aml] }
        sla_due_at: { type: string, format: date-time }
    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        permission: { type: string, example: accounts.freeze }
        target: { type: string, example: risk_case:FR-20931 }
        requested_by: { type: string }
        decision: { type: [string, 'null'], enum: [approved, rejected, null] }
        expires_at: { type: string, format: date-time }
