name: gebeya_one
description: EDash consumer app (wallet, payments, top-ups).
publish_to: none
version: 0.5.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: 3.0.6
  http: 1.2.2
  image_picker: 1.1.2
  flutter_secure_storage: 9.2.2
  mobile_scanner: 5.2.3
  qr_flutter: 4.1.0
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
